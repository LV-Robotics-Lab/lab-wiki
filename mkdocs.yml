site_name: LV Robotics Lab Wiki
site_description: Internal documentation for laboratory members
site_url: https://lv-robotics-lab.github.io/lab-wiki/
repo_name: LV-Robotics-Lab/lab-wiki
repo_url: https://github.com/LV-Robotics-Lab/lab-wiki
edit_uri: edit/main/docs/

# Keep implementation notes in the repository without publishing them as pages.
exclude_docs: |
  superpowers/

copyright: Copyright &copy; LV Robotics Lab

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            新成员入门: Onboarding
            入门总览: Overview
            新成员清单: New Member Checklist
            账号与权限: Accounts and Access
            AI API 申请与使用: AI API Access and Usage
            使用 CC Switch 配置 AI API: Configure AI APIs with CC Switch
            Codex CLI 多 Profile 与订阅登录: Codex CLI Profiles and Subscription Login
            用 AI 查询 Wiki: Ask the Wiki with AI
            实验室门禁: Lab Access
            E2-01-04 硬件实验室: E2-01-04 Hardware Lab
            行政流程: Administration
            行政总览: Overview
            报销流程: Reimbursement
            采购流程: Purchasing
            实验室资源: Lab Resources
            资源总览: Overview
            算力资源: Compute Resources
            远程接入: Remote Access
            数据存储与归档: Data Storage and Archiving
            真机硬件资源中心: Physical-Hardware Resource Center
            Ego 组设备清单: Ego Group Equipment Inventory
            研究与课程: Research and Courses
            研究方向与项目机会: Research Directions and Project Opportunities
            实验室分组名单: Lab Team Directory
            项目组出勤表: Project Team Attendance
            课程项目申请: Course Project Applications
            项目协作: Project Collaboration
            非真机组统一协作模式: Unified Collaboration for Non-Hardware Teams
            实验室仓库导览: Lab Repository Guide
            如何贡献: How to Contribute

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

nav:
  - 首页: index.md
  - 新成员入门:
      - 入门总览: onboarding/index.md
      - 新成员清单: onboarding/new-member.md
      - 账号与权限: onboarding/accounts.md
      - 实验室门禁: onboarding/lab-access.md
      - E2-01-04 硬件实验室: onboarding/hardware-lab-access.md
  - 行政流程:
      - 行政总览: administration/index.md
      - 报销流程: administration/reimbursement.md
      - 采购流程: administration/purchasing.md
  - 实验室资源:
      - 资源总览: resources/index.md
      - AI API 申请与使用: resources/ai-api-access.md
      - 使用 CC Switch 配置 AI API: resources/cc-switch.md
      - Codex CLI 多 Profile 与订阅登录: resources/codex-cli.md
      - 用 AI 查询 Wiki: resources/ask-wiki.md
      - 算力资源: resources/compute-access.md
      - 远程接入: resources/remote-access.md
      - 数据存储与归档: resources/data-management.md
      - 真机硬件资源中心: resources/hardware.md
      - Ego 组设备清单: resources/ego-devices.md
  - 研究与课程:
      - 研究方向与项目机会: projects/index.md
      - 实验室分组名单: projects/teams.md
      - 项目组出勤表: projects/attendance.md
      - 课程项目申请: academics/project-courses.md
  - 项目协作:
      - 非真机组统一协作模式: project-collaboration/non-hardware-worktree.md
      - 实验室仓库导览: project-collaboration/repository-guide.md
  - 如何贡献: contributing.md
